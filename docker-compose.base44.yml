# Base44 development environment for the AGENVO studio website (./site).
# Runs the site from the cloned source with Vite hot reload on host port 3000,
# plus the contact-API service the form posts to through the Vite /api proxy.
name: agenvo

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    labels:
      base44.project: "AGENVO Website"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./site:/app
      - site_node_modules:/app/node_modules
    environment:
      # Bare pass-through: the platform supplies BASE44_PREVIEW_MODE=1 in the sandbox.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - API_URL=http://api:4000
      - CHOKIDAR_USEPOLLING=1
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: on-failure

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    labels:
      base44.project: "AGENVO Contact API"
      base44.kind: "api"
      base44.port: "4000"
    volumes:
      - ./site:/app
    environment:
      - PORT=4000
    command: ["node", "server/index.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

volumes:
  site_node_modules:
