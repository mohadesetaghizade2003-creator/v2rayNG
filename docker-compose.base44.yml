services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      - BASE44_PREVIEW_MODE
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ./website:/app
      - website_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "Real Estate Website"
      base44.kind: web
      base44.port: "3000"

volumes:
  website_node_modules:
